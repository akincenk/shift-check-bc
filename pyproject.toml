[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shift-check-bc"
version = "0.1.0.dev0"
description = "Check a staff schedule against the hours of work and overtime rules of the BC Employment Standards Act."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Cenk Akin" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
shift-check = "shift_check.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/shift_check"]
